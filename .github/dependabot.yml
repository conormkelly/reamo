version: 2
updates:
  # The web UI's npm dependencies. A version must be out for 7 days (14 for
  # a major) before Dependabot proposes it, matching frontend/.npmrc's
  # min-release-age; security updates aren't held back.
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
      semver-major-days: 14
    ignore:
      # typescript-eslint drives TypeScript through its JS compiler API,
      # which TypeScript 7 (the native compiler) doesn't provide, and its
      # peer range stops before 7. Lift this when that range admits 7.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # The Node types follow the oldest Node that engines allows (22), so
      # they can't offer APIs that Node lacks. Move their major together
      # with engines and the workflows' node-version.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      dev-minor-patch:
        dependency-type: development
        update-types: [minor, patch]
      runtime-minor-patch:
        dependency-type: production
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ['*']

  # The WebSocket integration tests' npm dependencies, all dev tooling.
  # Same cooldown as the web UI, matching tests/ws-integration/.npmrc.
  - package-ecosystem: npm
    directory: /tests/ws-integration
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-major-days: 14
    ignore:
      # As for /frontend: typescript-eslint can't drive TypeScript 7.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      minor-patch:
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ['*']

  # Actions are pinned to commit SHAs; Dependabot moves the SHA and its
  # version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
