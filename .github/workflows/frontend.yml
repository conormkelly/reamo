name: Frontend

# Dependency checks, lint, tests and build for the web UI, on every PR that
# touches it. Read-only, no secrets: the job runs code from the PR.
on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/**'
      - '.github/scripts/**'
      - '.github/dependabot.yml'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      # Node 22's own npm predates the settings in frontend/.npmrc and would
      # refuse the install (package.json's engines); this is the npm they need.
      - name: Install npm
        run: npm install -g npm@11.21.1 && npm --version

      - name: Install dependencies from the lockfile
        run: npm ci --ignore-scripts

      # Runtime dependencies ship to every user's browser: any advisory fails.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=low

      # Dev tooling runs here and on developers' machines: high and critical fail.
      - name: Audit all dependencies
        run: npm audit --audit-level=high

      # Invalid signatures fail; missing ones and registry errors warn.
      - name: Verify registry signatures
        run: ../.github/scripts/npm-audit-signatures.sh

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  # Dependencies a PR adds or changes, judged by GitHub's advisory database:
  # runtime at any severity, dev tooling at high and above.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Runtime dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-scopes: runtime
          fail-on-severity: low

      - name: Dev dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-scopes: development
          fail-on-severity: high
