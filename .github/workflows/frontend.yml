name: Frontend

# Dependency checks, lint, tests and build for the web UI, on every PR that
# touches it. Read-only, no secrets: the job runs code from the PR.
on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/**'
      - '.github/dependabot.yml'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      # Node 22's own npm predates the settings in frontend/.npmrc and would
      # refuse the install (package.json's engines); this is the npm they need.
      - name: Install npm
        run: npm install -g npm@11.21.1 && npm --version

      - name: Install dependencies from the lockfile
        run: npm ci --ignore-scripts

      # Runtime dependencies ship to every user's browser: any advisory fails.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=low

      # Dev tooling runs here and on developers' machines: high and critical fail.
      - name: Audit all dependencies
        run: npm audit --audit-level=high

      # A package whose registry signature doesn't verify fails. A missing
      # signature or attestation only warns, and so does the check itself
      # erroring (the registry's attestation service has transient failures).
      - name: Verify registry signatures
        run: |
          for attempt in 1 2 3; do
            npm audit signatures --json > "$RUNNER_TEMP/signatures.json" 2>/dev/null || true
            if jq -e '.error' "$RUNNER_TEMP/signatures.json" > /dev/null 2>&1; then
              echo "::warning::npm audit signatures errored (attempt $attempt): $(jq -c '.error' "$RUNNER_TEMP/signatures.json")"
              sleep 20
              continue
            fi
            invalid=$(jq '(.invalid // []) | length' "$RUNNER_TEMP/signatures.json")
            missing=$(jq '(.missing // []) | length' "$RUNNER_TEMP/signatures.json")
            if [ "$invalid" -gt 0 ]; then
              jq '.invalid' "$RUNNER_TEMP/signatures.json"
              echo "::error::$invalid packages have invalid registry signatures or attestations"
              exit 1
            fi
            if [ "$missing" -gt 0 ]; then
              jq '.missing' "$RUNNER_TEMP/signatures.json"
              echo "::warning::$missing packages have no registry signature or attestation"
            fi
            exit 0
          done
          echo "::warning::npm audit signatures didn't complete; not failing on it"

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  # Dependencies a PR adds or changes, judged by GitHub's advisory database:
  # runtime at any severity, dev tooling at high and above.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Runtime dependencies
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-scopes: runtime
          fail-on-severity: low

      - name: Dev dependencies
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-scopes: development
          fail-on-severity: high
