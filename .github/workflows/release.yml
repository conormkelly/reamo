name: Release

on:
  push:
    tags:
      - 'v*'

# Read-only by default; only the release job writes.
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            ext_lib: libreaper_reamo.so
            ext_dest: reaper_reamo.so
            ext_dir: lib
          - os: macos-15
            platform: macos
            ext_lib: libreaper_reamo.dylib
            ext_dest: reaper_reamo.dylib
            ext_dir: lib
          - os: windows-2025
            platform: windows
            ext_lib: reaper_reamo.dll
            ext_dest: reaper_reamo.dll
            ext_dir: bin

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      # Node 22's own npm predates the settings in frontend/.npmrc and would
      # refuse the install (package.json's engines); this is the npm they need.
      - name: Install npm
        run: npm install -g npm@11.21.1 && npm --version

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Install frontend dependencies
        run: cd frontend && npm ci --ignore-scripts

      - name: Run tests
        shell: bash
        run: |
          cd frontend && npm test
          cd ../extension && zig build test ${{ matrix.platform == 'linux' && '-Doptimize=ReleaseSafe' || '' }}

      - name: Build frontend
        shell: bash
        run: cd frontend && npm run build

      # Every release build names its target explicitly. A target-less build
      # compiles for the CI runner's CPU, and one unsupported instruction
      # crashes REAPER at startup on the user's machine (#31, #32).
      # glibc 2.28 = Debian 10 / Ubuntu 20.04 / RHEL 8 and newer.
      - name: Build extension (Linux)
        if: matrix.platform == 'linux'
        run: cd extension && zig build -Doptimize=ReleaseSafe -Dtarget=x86_64-linux-gnu.2.28 -Dcpu=baseline

      - name: Build extension (macOS universal)
        if: matrix.platform == 'macos'
        run: |
          cd extension
          # Build arm64 (arm64 Macs require minimum macOS 11.0)
          zig build -Doptimize=ReleaseSafe -Dtarget=aarch64-macos.11.0
          cp zig-out/lib/libreaper_reamo.dylib ../reaper_reamo_arm64.dylib
          # Build x86_64 (support back to Catalina 10.15)
          zig build -Doptimize=ReleaseSafe -Dtarget=x86_64-macos.10.15
          # Create universal binary
          lipo -create \
            ../reaper_reamo_arm64.dylib \
            zig-out/lib/libreaper_reamo.dylib \
            -output zig-out/lib/libreaper_reamo.dylib
          rm ../reaper_reamo_arm64.dylib

      - name: Build extension (Windows)
        if: matrix.platform == 'windows'
        shell: bash
        run: cd extension && zig build -Doptimize=ReleaseSafe -Dtarget=x86_64-windows -Dcpu=baseline

      - name: Get version
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./frontend/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Package release
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DIR="REAmo-v${VERSION}-${{ matrix.platform }}"
          mkdir -p "${DIR}/reamo" "${DIR}/effects/REAmo"
          cp "extension/zig-out/${{ matrix.ext_dir }}/${{ matrix.ext_lib }}" "${DIR}/${{ matrix.ext_dest }}"
          cp -r reamo/* "${DIR}/reamo/"
          cp extension/effects/REAmo/PitchDetect.jsfx "${DIR}/effects/REAmo/"
          cp installer/Install_REAmo.lua "${DIR}/"
          cp installer/Uninstall_REAmo.lua "${DIR}/"
          cp installer/README.txt "${DIR}/"
          7z a -r "${DIR}.zip" "${DIR}"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.platform }}
          path: REAmo-v*-${{ matrix.platform }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          merge-multiple: true

      - name: Install LLVM
        run: sudo apt-get update && sudo apt-get install -y llvm && llvm-objdump --version

      # Check the packaged bytes users will download, not intermediate build
      # output. macOS is checked against core2 (the oldest Intel Mac CPU);
      # the checker extracts the x86_64 slice of the universal dylib itself.
      - name: Verify x86-64 CPU baseline
        run: |
          mkdir unpacked
          for zip in artifacts/REAmo-v*.zip; do unzip -q "$zip" -d unpacked; done
          python3 -I scripts/check-cpu-baseline.py unpacked/*/reaper_reamo.so unpacked/*/reaper_reamo.dll
          python3 -I scripts/check-cpu-baseline.py --profile core2 unpacked/*/reaper_reamo.dylib

      - name: Generate checksums
        run: |
          cd artifacts
          for zip in REAmo-v*.zip; do
            sha256sum "$zip" > "${zip}.sha256"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            artifacts/REAmo-v*.zip
            artifacts/REAmo-v*.zip.sha256
          generate_release_notes: true
          draft: true
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
