name: Release

on:
  push:
    tags:
      - 'v*'

# Read-only by default. Only the attest job can mint an OIDC token and only
# the release job can write: the build jobs run dependency code (npm, Zig)
# and get neither.
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            ext_lib: libreaper_reamo.so
            ext_dest: reaper_reamo.so
            ext_dir: lib
          - os: macos-15
            platform: macos
            ext_lib: libreaper_reamo.dylib
            ext_dest: reaper_reamo.dylib
            ext_dir: lib
          - os: windows-2025
            platform: windows
            ext_lib: reaper_reamo.dll
            ext_dest: reaper_reamo.dll
            ext_dir: bin

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Get version
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./frontend/package.json').version")" >> "$GITHUB_OUTPUT"

      # The pre-push hook checks this too, but hooks can be skipped. A zip
      # named for one version must not hold another.
      - name: Check the tag matches the version
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match frontend/package.json version $VERSION (run scripts/bump-version.sh)"
            exit 1
          fi

      # Node 22's own npm predates the settings in frontend/.npmrc and would
      # refuse the install (package.json's engines); this is the npm they need.
      - name: Install npm
        run: npm install -g npm@11.21.1 && npm --version

      # Checked against a pinned SHA-256 and never cached, so a release is
      # built by exactly the compiler pinned in the script.
      - name: Install Zig
        shell: bash
        run: .github/scripts/install-zig.sh 0.15.2

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Install frontend dependencies
        run: cd frontend && npm ci --ignore-scripts

      - name: Run tests
        shell: bash
        run: |
          cd frontend && npm test
          cd ../extension && zig build test ${{ matrix.platform == 'linux' && '-Doptimize=ReleaseSafe' || '' }}

      - name: Build frontend
        shell: bash
        run: cd frontend && npm run build

      # Every release build names its target explicitly. A target-less build
      # compiles for the CI runner's CPU, and one unsupported instruction
      # crashes REAPER at startup on the user's machine (#31, #32).
      # glibc 2.28 = Debian 10 / Ubuntu 20.04 / RHEL 8 and newer.
      - name: Build extension (Linux)
        if: matrix.platform == 'linux'
        run: cd extension && zig build -Doptimize=ReleaseSafe -Dtarget=x86_64-linux-gnu.2.28 -Dcpu=baseline

      - name: Build extension (macOS universal)
        if: matrix.platform == 'macos'
        run: |
          cd extension
          # Build arm64 (arm64 Macs require minimum macOS 11.0)
          zig build -Doptimize=ReleaseSafe -Dtarget=aarch64-macos.11.0
          cp zig-out/lib/libreaper_reamo.dylib ../reaper_reamo_arm64.dylib
          # Build x86_64 (support back to Catalina 10.15)
          zig build -Doptimize=ReleaseSafe -Dtarget=x86_64-macos.10.15
          # Create universal binary
          lipo -create \
            ../reaper_reamo_arm64.dylib \
            zig-out/lib/libreaper_reamo.dylib \
            -output zig-out/lib/libreaper_reamo.dylib
          rm ../reaper_reamo_arm64.dylib

      - name: Build extension (Windows)
        if: matrix.platform == 'windows'
        shell: bash
        run: cd extension && zig build -Doptimize=ReleaseSafe -Dtarget=x86_64-windows -Dcpu=baseline

      - name: Package release
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          EXT_DIR: ${{ matrix.ext_dir }}
          EXT_LIB: ${{ matrix.ext_lib }}
          EXT_DEST: ${{ matrix.ext_dest }}
        run: |
          DIR="REAmo-v${VERSION}-${PLATFORM}"
          mkdir -p "${DIR}/reamo" "${DIR}/effects/REAmo"
          cp "extension/zig-out/${EXT_DIR}/${EXT_LIB}" "${DIR}/${EXT_DEST}"
          cp -r reamo/* "${DIR}/reamo/"
          cp extension/effects/REAmo/PitchDetect.jsfx "${DIR}/effects/REAmo/"
          cp installer/Install_REAmo.lua "${DIR}/"
          cp installer/Uninstall_REAmo.lua "${DIR}/"
          cp installer/README.txt "${DIR}/"
          7z a -r "${DIR}.zip" "${DIR}"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.platform }}
          path: REAmo-v*-${{ matrix.platform }}.zip

  # Check the packaged bytes users will download, not intermediate build
  # output, before anything is attested or released: an attestation is public
  # and permanent. macOS is checked against core2 (the oldest Intel Mac CPU);
  # the checker extracts the x86_64 slice of the universal dylib itself.
  verify:
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      - name: Install LLVM
        run: sudo apt-get update && sudo apt-get install -y llvm && llvm-objdump --version

      - name: Verify x86-64 CPU baseline
        run: |
          mkdir unpacked
          for zip in artifacts/REAmo-v*.zip; do unzip -q "$zip" -d unpacked; done
          python3 -I scripts/check-cpu-baseline.py unpacked/*/reaper_reamo.so unpacked/*/reaper_reamo.dll
          python3 -I scripts/check-cpu-baseline.py --profile core2 unpacked/*/reaper_reamo.dylib

  # Signed SLSA build provenance for each zip, recorded with GitHub (Sigstore).
  # Users check a download with:
  #   gh attestation verify REAmo-v<version>-<platform>.zip -R conormkelly/reamo
  # A job of its own so the OIDC token never reaches a job that runs
  # dependency code or holds write access to the repository.
  attest:
    needs: [build, verify]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/REAmo-v*.zip

  release:
    needs: [build, verify, attest]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          for zip in REAmo-v*.zip; do
            sha256sum "$zip" > "${zip}.sha256"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            artifacts/REAmo-v*.zip
            artifacts/REAmo-v*.zip.sha256
          generate_release_notes: true
          draft: true
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
